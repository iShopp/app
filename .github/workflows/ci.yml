name: CI

on:
  push:
    branches: [main, master, develop, 'copilot/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint || true   # report but don't fail (scaffold may have lint warnings)

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint-build:
    name: Backend — lint, type-check & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

  # ─── Backend unit tests ─────────────────────────────────────────────────────
  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    needs: backend-lint-build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test -- --passWithNoTests
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ishop_neon_fx_test'
          JWT_SECRET: 'ci-test-secret'
          REDIS_URL: 'redis://localhost:6379'
          NODE_ENV: test
